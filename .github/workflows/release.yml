name: Verify and publish release candidate

on:
  push:
    branches: [main]
    tags: ['v*-rc.*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify installer and every embedded file without executing PHP
        run: python3 tools/verify_release.py
      - name: Check PHP syntax
        run: php -l c1zz-blog-install-0.40.2.php
      - name: Verify release metadata matches tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          assert json.load(open('release.json'))['tag'] == os.environ['RELEASE_TAG']
          PY

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact committed installer
        run: python3 tools/verify_release.py
      - name: Attest complete installer from this release workflow
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: c1zz-blog-install-0.40.2.php
      - name: Publish pre-release with checksum and provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp -- "$ATTESTATION_BUNDLE" c1zz-blog-install-0.40.2.php.sigstore.json
          gh release create "$RELEASE_TAG" \
            --verify-tag --prerelease \
            --title "c1zz Blog für Gambio · 0.40.2-rc.1" \
            --notes-file RELEASE_NOTES.md \
            c1zz-blog-install-0.40.2.php SHA256SUMS LICENSE \
            c1zz-blog-install-0.40.2.php.sigstore.json
